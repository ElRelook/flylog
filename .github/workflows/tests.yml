name: tests

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,plot]"
      - name: Ruff (style)
        run: ruff check .
      - name: Mypy (types)
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,plot]" pytest-cov
      - name: Tests
        run: pytest -v --cov=flylog --cov-report=term --cov-report=markdown:coverage.md
      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: cat coverage.md >> "$GITHUB_STEP_SUMMARY"
