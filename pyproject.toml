[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flylog"
version = "0.1.0"
description = "Analyse de traces de vol libre (parapente, delta) au format IGC"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
plot = ["folium>=0.15", "matplotlib>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
flylog = "flylog.cli:main"

[tool.setuptools]
packages = ["flylog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
