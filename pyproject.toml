[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flylog-igc"
version = "0.2.0"
description = "Paragliding / hang gliding IGC flight analysis: stats, thermals, wind, XContest-style score, airspace check, logbook, video overlay"
readme = "README.en.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Clément Basdevant" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["paragliding", "parapente", "igc", "gps", "flight-log", "thermals", "xcontest", "openair"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: French",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://elrelook.github.io/flylog/"
Source = "https://github.com/ElRelook/flylog"
Changelog = "https://github.com/ElRelook/flylog/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = ["folium>=0.15", "matplotlib>=3.7"]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
flylog = "flylog.cli:main"

[tool.setuptools]
packages = ["flylog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B905"]  # zip(strict=) adds noise here: the zipped lists are built together

[tool.mypy]
python_version = "3.12"
files = ["flylog"]
ignore_missing_imports = true
check_untyped_defs = true
